name: Check deadlines and notify

on:
  schedule:
    # Runs at 01:00 UTC = 08:00 Bangkok time, every day.
    - cron: '0 1 * * *'
  workflow_dispatch: # lets you trigger it manually from the Actions tab to test

jobs:
  notify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run notification check
        run: node check-and-notify.js
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:you@example.com
